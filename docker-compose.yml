services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redal-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/reclamations.db:/app/reclamations.db
      - ./backend/chroma_db:/app/chroma_db
    # Assuming Ollama runs on the host machine. 
    # Use host.docker.internal to allow the backend container to reach the host's Ollama instance.
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: redal-rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
